# ─── doris-reactive-lab 配置 ───
# 凭据纪律：本文件不含任何真实密码；dev-test 连接值经 local.env（gitignored）注入环境变量。
# 三个数据源共用同一 Doris dev-test 实例（dev-test Doris 实例（地址与库名略），LAB_DORIS_* 可覆盖）。

quarkus.application.name=doris-reactive-lab
quarkus.http.port=8081

# ─── 数据源 1: default —— Hibernate Reactive 专用（仅 reactive，JDBC 池显式禁用） ───
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${LAB_DORIS_USER:root}
quarkus.datasource.password=${LAB_DORIS_PASSWORD:}
quarkus.datasource.reactive.url=mysql://${LAB_DORIS_HOST:127.0.0.1}:${LAB_DORIS_PORT:9030}/${LAB_DORIS_DB:lab}
# Doris 线上报 MySQL 兼容版本 5.7.99；Quarkus MySQL 方言默认最低 8.0.0，不钉 db-version 启动时版本核验直接拒绝
# （2026-11-25 实跑实证：PersistenceException → ConfigurationException db version 5.7.99 < 8.0.0）
quarkus.datasource.db-version=5.7.99
quarkus.datasource.jdbc=false

# ─── 数据源 2: dorispool —— MySQLPool 路线（独立命名数据源，与 ORM 数据源隔离） ───
quarkus.datasource.dorispool.db-kind=mysql
quarkus.datasource.dorispool.username=${LAB_DORIS_USER:root}
quarkus.datasource.dorispool.password=${LAB_DORIS_PASSWORD:}
quarkus.datasource.dorispool.reactive.url=mysql://${LAB_DORIS_HOST:127.0.0.1}:${LAB_DORIS_PORT:9030}/${LAB_DORIS_DB:lab}
quarkus.datasource.dorispool.reactive.max-size=8
quarkus.datasource.dorispool.jdbc=false

# ─── 数据源 3: dorisjdbc —— JDBC/Agroal 三方对照基线（URL 形态对齐生产项目 starrocks 数据源） ───
quarkus.datasource.dorisjdbc.db-kind=mysql
quarkus.datasource.dorisjdbc.username=${LAB_DORIS_USER:root}
quarkus.datasource.dorisjdbc.password=${LAB_DORIS_PASSWORD:}
quarkus.datasource.dorisjdbc.jdbc.url=jdbc:mysql://${LAB_DORIS_HOST:127.0.0.1}:${LAB_DORIS_PORT:9030}/${LAB_DORIS_DB:lab}?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&serverTimezone=Asia/Shanghai
quarkus.datasource.dorisjdbc.jdbc.max-size=8
quarkus.datasource.dorisjdbc.reactive=false

# ─── Hibernate Reactive（配置根沿用 quarkus.hibernate-orm.*，生产项目同版本实证形态） ───
# 场景四 D1：方言探测。方言经环境变量 QUARKUS_HIBERNATE_ORM_DIALECT 由 run-e2e.sh 注入
# （显式 MySQL 方言为主跑形态；「不注方言启动」是 boot 变体实验，见 COMPAT-MATRIX）
quarkus.hibernate-orm.blocking=false
quarkus.hibernate-orm.packages=io.dorislab.doris.hr
quarkus.hibernate-orm.schema-management.strategy=none
# 测试期保留 SQL 日志，作为「HR 生成的 SQL 形态」证据来源（LIMIT 是否参数化等）
quarkus.hibernate-orm.log.sql=true

# e2e runner 按固定端口起停应用
quarkus.http.port=8081
